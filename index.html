<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr Migrate TIRE Questionnaire App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Fixed content area -->
        <div class="fixed-content">
            <div class="header-container">
                <h1>Dr Migrate TIRE Questionnaire App</h1>
                <button id="adminBtn" class="admin-button">Admin Settings</button>
            </div>

            <!-- Upload Excel File -->
            <div class="button-container">
                <!--<button id="uploadBtn">Upload Excel File</button>-->
            </div>
            <p id="statusMessage"></p>


            <!-- Dashboard metrics -->
            <div class="dashboard">
                <div class="metric">
                    <div class="metric-value" id="totalApps">0</div>
                    <div class="metric-label">Total Apps</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="inScope">0</div>
                    <div class="metric-label">In Scope</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="outScope">0</div>
                    <div class="metric-label">Out of Scope</div>
                </div>
                <div class="metric">
                    <div class="metric-value" id="completedApps">0</div>
                    <div class="metric-label">Completed Apps</div>
                </div>
            </div>

                 <!-- Search and filter container -->
                 <div class="search-filter-container">
                    <input type="text" id="searchInput" placeholder="Search applications..." />
                    <div class="filter-options">
                        <label><input type="checkbox" id="inScopeCheckbox" /> In Scope</label>
                        <label><input type="checkbox" id="outScopeCheckbox" /> Out of Scope</label>
                        <label><input type="checkbox" id="completedCheckbox" /> Completed</label>
                        <label><input type="checkbox" id="uncompletedCheckbox" /> Uncompleted</label>
                    </div>
                </div>

            <!-- Export button -->
            <div class="export-container">
                <!--<button id="createExportBtn">Create Export</button>-->
                <button id="exportBtn">Export Completed Apps</button>
                <button id="clearStorageBtn" class="clear-btn">Clear Data</button>
            </div>
        </div>

        <!-- Scrollable table area -->
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Application</th>
                        <th>Assessment Scope</th>
                        <th>Data Center</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <!-- Rows will be dynamically populated -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Clear Data Confirmation Modal -->
    <div id="clearDataModal" class="modal">
        <div class="modal-content">
            <h2>Clear All Data?</h2>
            <p>This will clear all application data and return you to the start screen. This action cannot be undone.</p>
            <div class="modal-buttons">
                <button id="cancelClearBtn" class="cancel-button">Cancel</button>
                <button id="confirmClearBtn" class="confirm-button">Clear Data</button>
            </div>
        </div>
    </div>

    <!-- Load renderer.js at the end of body -->
    <script src="renderer.js"></script>
</body>
</html>
