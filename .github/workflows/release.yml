name: Build and Release TIRE App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Source Code Archive
        run: |
          git archive --format=zip --output="Dr-Migrate-TIRE-App-${{ steps.extract_version.outputs.version }}-source.zip" HEAD

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Dr Migrate TIRE App v${{ steps.extract_version.outputs.version }}
          tag: ${{ github.ref_name }}
          bodyFile: release-notes.md
          allowUpdates: true
          updateOnlyUnreleased: false
          replacesArtifacts: true
          artifacts: "Dr-Migrate-TIRE-App-${{ steps.extract_version.outputs.version }}-source.zip"

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install
          npm audit fix --force || true  # Fix audit issues but don't fail if can't fix all

      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Create a backup of package.json
          Copy-Item -Path package.json -Destination package.json.backup
          
          # Create a new package.json without publish config
          node -e "const pkg = require('./package.json'); delete pkg.build.publish; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2))"
          
          # Build the app
          npm run build:win
          
          # Create dist directory if it doesn't exist and list contents
          New-Item -ItemType Directory -Force -Path dist
          Get-ChildItem dist
          
          # Restore original package.json
          Copy-Item -Path package.json.backup -Destination package.json
          Remove-Item package.json.backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE: true
          PUBLISH_FOR_PULL_REQUEST: false
          DEBUG: electron-builder,electron-builder:*

      - name: Build Mac App
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # Create a backup of package.json
          cp package.json package.json.backup
          
          # Create a new package.json without publish config
          node -e "const pkg = require('./package.json'); delete pkg.build.publish; require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2))"
          
          # Build the app with verbose output
          DEBUG=electron-builder npm run build:mac
          ls -la dist/
          
          # Restore original package.json
          cp package.json.backup package.json
          rm package.json.backup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
          EP_GH_IGNORE: true
          PUBLISH_FOR_PULL_REQUEST: false
          DEBUG: electron-builder,electron-builder:*

      # Clean up unnecessary files for Windows
      - name: Clean Windows artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Set-Location dist
          Remove-Item -Path *.blockmap -ErrorAction SilentlyContinue
          Remove-Item -Path *.yaml -ErrorAction SilentlyContinue
          Remove-Item -Path *.yml -ErrorAction SilentlyContinue

      # Clean up unnecessary files for Mac
      - name: Clean Mac artifacts
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist
          rm -f *.blockmap
          rm -f *.yaml
          rm -f *.yml
          rm -f *.dmg

      - name: Upload Windows Build
        if: matrix.os == 'windows-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr-Migrate-TIRE-App ${{ needs.create-release.outputs.version }}.exe"
          artifactContentType: application/octet-stream

      - name: Upload Mac Build
        if: matrix.os == 'macos-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr-Migrate-TIRE-App-${{ needs.create-release.outputs.version }}-arm64-mac.zip"
          artifactContentType: application/zip 