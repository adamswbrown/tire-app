name: Build and Release TIRE App

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Create Source Code Archive
        run: |
          git archive --format=zip --output="Dr-Migrate-TIRE-App-${{ steps.extract_version.outputs.version }}-source.zip" HEAD

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          name: Dr Migrate TIRE App v${{ steps.extract_version.outputs.version }}
          tag: ${{ github.ref_name }}
          bodyFile: release-notes.md
          allowUpdates: true
          updateOnlyUnreleased: false
          replacesArtifacts: true
          artifacts: "Dr-Migrate-TIRE-App-${{ steps.extract_version.outputs.version }}-source.zip"

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: |
          # Temporarily disable publishing in package.json
          mv package.json package.json.bak
          jq 'del(.build.publish)' package.json.bak > package.json
          npm run build
          mv package.json.bak package.json
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_HARD_LINKS: false

      # Clean up unnecessary files for Windows
      - name: Clean Windows artifacts
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          rm -f *.blockmap
          rm -f *.yaml
          rm -f *.yml

      # Clean up unnecessary files for Mac
      - name: Clean Mac artifacts
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          rm -f *.blockmap
          rm -f *.yaml
          rm -f *.yml
          rm -f *.dmg

      - name: Upload Windows Build
        if: matrix.os == 'windows-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr-Migrate-TIRE-App-${{ needs.create-release.outputs.version }}.exe"
          artifactContentType: application/octet-stream

      - name: Upload Mac Build
        if: matrix.os == 'macos-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr-Migrate-TIRE-App-${{ needs.create-release.outputs.version }}-arm64-mac.zip"
          artifactContentType: application/zip 