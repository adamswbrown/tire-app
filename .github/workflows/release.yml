name: Build and Release TIRE App

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Extract Version
        id: extract_version
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Get Release Notes
        id: release_notes
        run: |
          if [ -f "release-notes.md" ]; then
            echo "NOTES=$(cat release-notes.md)" >> $GITHUB_OUTPUT
          else
            echo "NOTES=Release v${{ steps.extract_version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Source Code Archive
        run: |
          git archive --format=zip --output="Dr.Migrate.TIRE.App-${{ steps.extract_version.outputs.version }}-source.zip" HEAD

      - name: Create/Update Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          name: Dr Migrate TIRE App v${{ steps.extract_version.outputs.version }}
          tag: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.NOTES }}
          allowUpdates: true
          updateOnlyUnreleased: false
          replacesArtifacts: true
          artifacts: "Dr.Migrate.TIRE.App-${{ steps.extract_version.outputs.version }}-source.zip"

  build-and-upload:
    needs: create-release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build Electron app
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          USE_HARD_LINKS: false

      - name: Upload Windows Build
        if: matrix.os == 'windows-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr Migrate TIRE App ${{ needs.create-release.outputs.version }}.exe"
          artifactContentType: application/octet-stream

      - name: Upload Mac Build
        if: matrix.os == 'macos-latest'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GH_TOKEN }}
          tag: ${{ github.ref_name }}
          allowUpdates: true
          updateOnlyUnreleased: false
          omitBody: true
          omitPrereleaseDuringUpdate: true
          artifacts: "./dist/Dr Migrate TIRE App-${{ needs.create-release.outputs.version }}-arm64-mac.zip"
          artifactContentType: application/zip 